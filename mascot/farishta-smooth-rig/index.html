<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farishta — continuous motion</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7ef;color:#163f31;font:16px/1.6 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;padding-bottom:20px;border-bottom:1px solid #dce6d8}.brand{font:28px Georgia,serif}.domain{font-size:12px;color:#74846f}section{text-align:center;padding:32px 0}h1{font:44px/1.1 Georgia,serif;letter-spacing:-1px;margin:16px 0}p{color:#6c7e67;max-width:480px;margin:14px auto}.stage{background:#eff7ef;border:1px solid #e0e9db;border-radius:32px;max-width:540px;margin:24px auto;display:grid;place-items:center}.rig{position:relative;width:min(440px,100%);aspect-ratio:1;--flap-duration:1.2s;--float-duration:3.6s}.reaction,.hover,.mirror{position:absolute;inset:0}.hover{animation:float var(--float-duration) ease-in-out infinite}.mirror{transform:scaleX(-1)}.wing{position:absolute;left:-1%;top:27.75%;width:45%;height:33.75%;transform-origin:80% 69%;animation:flap var(--flap-duration) ease-in-out infinite}.body{position:absolute;left:20%;top:12.5%;width:60%;height:60%;pointer-events:none}.rig img{object-fit:contain;user-select:none;-webkit-user-drag:none}.tap{position:absolute;inset:10%;background:none;border:0;border-radius:50%;cursor:pointer}.tap:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #b8923e;outline-offset:4px}.greeting .left-wing{animation:wave 1.6s ease-in-out 1}.celebrating .reaction{animation:bounce 1.2s ease-in-out 1}.rig[data-motion=off] *{animation-play-state:paused!important}@keyframes flap{0%,100%{transform:rotate(0deg) scaleX(.86)}25%{transform:rotate(10deg) scaleX(1)}75%{transform:rotate(-10deg) scaleX(.72)}}@keyframes float{0%,100%{transform:translateY(0)}25%{transform:translateY(5px)}75%{transform:translateY(-5px)}}@keyframes wave{0%,100%{transform:rotate(0deg) scaleX(.86)}30%{transform:rotate(26deg) scaleX(.96)}50%{transform:rotate(15deg) scaleX(.96)}70%{transform:rotate(26deg) scaleX(.96)}}@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-22px)}60%{transform:translateY(0)}80%{transform:translateY(-7px)}}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{font:inherit;cursor:pointer}.pill{border:1px solid #d4e2cd;border-radius:100px;padding:9px 18px;background:white;color:#476748;font-size:13px}.pill.primary{background:#2f8f78;color:white;border-color:#2f8f78}.speed{display:flex;gap:12px;align-items:center;justify-content:center;font-size:12px;color:#71836c;margin:20px 0}input{accent-color:#2f8f78}.note{font-size:12px}.files{border-top:1px solid #dce6d8;margin-top:28px;padding-top:20px}a{color:#2f8061}footer{text-align:center;color:#7a8874;font-size:12px;padding:16px}@media(prefers-reduced-motion:reduce){.rig *{animation:none!important}}@media(max-width:560px){main{padding:20px}h1{font-size:36px}.domain{font-size:10px}.stage{margin:16px auto}.rig{width:360px;max-width:100%}}
</style></head><body><main><header><span class="brand">Farishta <span style="color:#b8923e">✦</span></span><span class="domain">farishta.si · layered motion study</span></header>
<section><h1>A softer way to move.</h1><p>One familiar face. Wings that flutter continuously. A little wave when you say hello.</p><div class="stage"><div class="rig" id="rig" data-motion="on"><div class="reaction"><div class="hover"><img class="wing left-wing" src="assets/wing.webp" alt=""><div class="mirror"><img class="wing" src="assets/wing.webp" alt=""></div><img class="body" src="assets/body.webp" alt="Farishta, the mint-and-gold glow companion"></div></div><button class="tap" aria-label="Say hello to Farishta"></button></div></div>
<div class="controls"><button class="pill primary" id="greet">Say hello</button><button class="pill" id="celebrate">Happy bounce</button><button class="pill" id="pause" aria-pressed="false">Pause motion</button></div><label class="speed">Wing speed <input id="speed" aria-label="Wing speed" type="range" min="0.6" max="1.4" step="0.1" value="1"><output id="rate">1×</output></label><p class="note" id="status" role="status" aria-live="polite">Tap Farishta for a little wave.</p>
<p class="note files"><a href="smooth-hover.gif" download>Download looping GIF</a> · <a href="smooth-hover.webp" download>Download looping WebP</a></p></section><footer>Continuous layered animation · the live site hasn’t changed.</footer></main><script>
const rig=document.getElementById('rig');let reactionTimer;
function react(kind){clearTimeout(reactionTimer);rig.classList.remove('greeting','celebrating');void rig.offsetWidth;rig.classList.add(kind);document.getElementById('status').textContent=kind==='greeting'?'Salaam! Lovely to see you.':'A little happy bounce.';reactionTimer=setTimeout(()=>{rig.classList.remove(kind);document.getElementById('status').textContent='Tap Farishta for a little wave.';},kind==='greeting'?1650:1250);}
document.getElementById('greet').addEventListener('click',()=>react('greeting'));document.querySelector('.tap').addEventListener('click',()=>react('greeting'));document.getElementById('celebrate').addEventListener('click',()=>react('celebrating'));
const pause=document.getElementById('pause');pause.addEventListener('click',()=>{const off=rig.dataset.motion!=='off';rig.dataset.motion=off?'off':'on';pause.textContent=off?'Resume motion':'Pause motion';pause.setAttribute('aria-pressed',String(off));});
document.getElementById('speed').addEventListener('input',event=>{const speed=Number(event.target.value);rig.style.setProperty('--flap-duration',1.2/speed+'s');document.getElementById('rate').textContent=speed+'×';});
const media=matchMedia('(prefers-reduced-motion: reduce)');if(media.matches){rig.dataset.motion='off';pause.textContent='Motion reduced by system setting';pause.disabled=true;}
</script></body></html>
